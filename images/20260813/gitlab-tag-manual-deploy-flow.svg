<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">GitLab Tag 觸發驗證並手動部署到 VM</title>
  <desc id="desc">開發者推送版本 Tag，GitLab Pipeline 自動驗證，人工確認後透過 SSH 到 VM 建置與部署。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171b2d"/>
      <stop offset="0.55" stop-color="#22223b"/>
      <stop offset="1" stop-color="#112c36"/>
    </linearGradient>
    <linearGradient id="gitlab" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fc6d26"/>
      <stop offset="1" stop-color="#e24329"/>
    </linearGradient>
    <linearGradient id="success" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#43c59e"/>
      <stop offset="1" stop-color="#1f8a70"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#080b14" flood-opacity="0.42"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M1 1l9 5-9 5z" fill="#9ba4c8"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1380" cy="90" r="320" fill="#fc6d26" opacity="0.08"/>
  <circle cx="170" cy="800" r="360" fill="#43c59e" opacity="0.07"/>
  <g opacity="0.18" fill="#ffffff">
    <circle cx="80" cy="90" r="3"/><circle cx="190" cy="90" r="3"/><circle cx="300" cy="90" r="3"/><circle cx="410" cy="90" r="3"/>
    <circle cx="1190" cy="790" r="3"/><circle cx="1300" cy="790" r="3"/><circle cx="1410" cy="790" r="3"/><circle cx="1520" cy="790" r="3"/>
  </g>

  <text x="110" y="125" fill="#ffffff" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="60" font-weight="800">GitLab CI/CD</text>
  <text x="110" y="184" fill="#c7cce2" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="30" font-weight="600">Tag 觸發驗證，人工確認後部署到 VM</text>

  <g filter="url(#shadow)">
    <rect x="110" y="310" width="280" height="300" rx="30" fill="#252a43" stroke="#454d73" stroke-width="2"/>
    <circle cx="250" cy="405" r="52" fill="#6772e5" opacity="0.2"/>
    <path d="M216 404h68M250 370v68" stroke="#8f98ff" stroke-width="12" stroke-linecap="round"/>
    <text x="250" y="505" text-anchor="middle" fill="#ffffff" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="30" font-weight="800">Push Tag</text>
    <text x="250" y="548" text-anchor="middle" fill="#b5bcd8" font-family="monospace" font-size="24">v1.2.3</text>

    <rect x="480" y="310" width="280" height="300" rx="30" fill="#252a43" stroke="#454d73" stroke-width="2"/>
    <path d="M591 365l29 53h-58zM649 365l29 53h-58zM620 448l-58-30h116z" fill="url(#gitlab)"/>
    <text x="620" y="505" text-anchor="middle" fill="#ffffff" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="30" font-weight="800">Pipeline Verify</text>
    <text x="620" y="548" text-anchor="middle" fill="#b5bcd8" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="21">Typecheck · Lint · Test</text>

    <rect x="850" y="310" width="280" height="300" rx="30" fill="#252a43" stroke="#454d73" stroke-width="2"/>
    <circle cx="990" cy="405" r="54" fill="#f5b942" opacity="0.18"/>
    <path d="M970 374l53 31-53 31z" fill="#f7c85b"/>
    <text x="990" y="505" text-anchor="middle" fill="#ffffff" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="30" font-weight="800">Manual Deploy</text>
    <text x="990" y="548" text-anchor="middle" fill="#b5bcd8" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="21">Click to confirm</text>

    <rect x="1220" y="310" width="280" height="300" rx="30" fill="#252a43" stroke="#454d73" stroke-width="2"/>
    <rect x="1356" y="354" width="8" height="98" rx="4" fill="#4dc8a0"/>
    <rect x="1302" y="372" width="116" height="82" rx="12" fill="url(#success)"/>
    <circle cx="1328" cy="398" r="7" fill="#d8fff1"/>
    <circle cx="1328" cy="426" r="7" fill="#d8fff1"/>
    <path d="M1352 398h42M1352 426h42" stroke="#d8fff1" stroke-width="6" stroke-linecap="round"/>
    <text x="1360" y="505" text-anchor="middle" fill="#ffffff" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="30" font-weight="800">Deploy on VM</text>
    <text x="1360" y="548" text-anchor="middle" fill="#b5bcd8" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="21">SSH · Build · Health Check</text>
  </g>

  <g fill="none" stroke="#9ba4c8" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M405 460h55"/>
    <path d="M775 460h55"/>
    <path d="M1145 460h55"/>
  </g>

  <g font-family="Arial, 'Noto Sans TC', sans-serif">
    <rect x="522" y="677" width="556" height="78" rx="39" fill="#111528" stroke="#3b4266" stroke-width="2"/>
    <circle cx="573" cy="716" r="15" fill="#43c59e"/>
    <text x="610" y="726" fill="#d6daed" font-size="25" font-weight="600">Secrets 留在 GitLab Variables，Runtime Env 留在 VM</text>
  </g>
</svg>
