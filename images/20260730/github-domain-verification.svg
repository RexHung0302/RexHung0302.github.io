<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <rect width="1200" height="600" rx="18" fill="#0d1117"/>
  <text x="45" y="62" fill="#58a6ff" font-family="Arial,sans-serif" font-size="30" font-weight="700">Pages / Add a verified domain</text>
  <text x="45" y="112" fill="#f0f6fc" font-family="Arial,sans-serif" font-size="28" font-weight="700">Add a DNS TXT record</text>
  <text x="45" y="152" fill="#b1bac4" font-family="Arial,sans-serif" font-size="19">驗證網域擁有權前，GitHub 會提供一組專屬的 Hostname 與 TXT Value。</text>
  <text x="65" y="212" fill="#f0f6fc" font-family="Arial,sans-serif" font-size="21" font-weight="700">1. 複製 GitHub 提供的 TXT Hostname</text>
  <rect x="65" y="232" width="750" height="55" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="90" y="267" fill="#8c959f" font-family="monospace" font-size="20">_github-pages-challenge-USERNAME</text>
  <text x="835" y="267" fill="#b1bac4" font-family="monospace" font-size="20">.zehung.com</text>
  <text x="65" y="335" fill="#f0f6fc" font-family="Arial,sans-serif" font-size="21" font-weight="700">2. 複製 GitHub 提供的 TXT Value</text>
  <rect x="65" y="355" width="920" height="55" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="90" y="390" fill="#8c959f" font-family="monospace" font-size="20">[每個帳號不同，請勿照抄文章或公開驗證碼]</text>
  <text x="65" y="458" fill="#f0f6fc" font-family="Arial,sans-serif" font-size="21" font-weight="700">3. 回 Cloudflare → DNS → Records，新增 TXT Record</text>
  <rect x="65" y="485" width="1070" height="75" rx="10" fill="#161b22" stroke="#f0883e"/>
  <text x="90" y="530" fill="#f0883e" font-family="monospace" font-size="19">TXT  |  _github-pages-challenge-USERNAME  |  GitHub 提供的 Value  |  TTL Auto</text>
</svg>
